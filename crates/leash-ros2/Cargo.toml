[package]
name = "leash-ros2"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ROS 2 conversion and bounded callback boundary for Leash"
repository = "https://github.com/specdog/leash"

[lib]
path = "src/lib.rs"

[features]
default = []
native-rclrs = ["dep:rclrs", "dep:ros-env"]
rclrs-shim = ["native-rclrs", "rclrs/use_ros_shim", "ros-env/use_ros_shim"]

[dependencies]
leash-core = { path = "../leash-core", version = "0.1.0" }
leash-runtime = { path = "../leash-runtime", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
rclrs = { version = "0.7.0", optional = true, default-features = false }
ros-env = { version = "0.2.0", optional = true, default-features = false }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
