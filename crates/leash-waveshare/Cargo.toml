[package]
name = "leash-waveshare"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Single-owner Waveshare UGV controller adapter for Leash"
repository = "https://github.com/specdog/leash"

[lib]
path = "src/lib.rs"

[features]
default = []
serial = ["dep:serialport"]

[dependencies]
leash-core = { path = "../leash-core", version = "0.1.0" }
leash-runtime = { path = "../leash-runtime", version = "0.1.0" }
serde_json = "1.0"
serialport = { version = "4.6", optional = true }
