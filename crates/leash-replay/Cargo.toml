[package]
name = "leash-replay"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic replay oracle for the Leash control kernel"
repository = "https://github.com/specdog/leash"

[lib]
path = "src/lib.rs"

[dependencies]
leash-core = { path = "../leash-core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
