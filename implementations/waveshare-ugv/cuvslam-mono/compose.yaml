name: leash-cuvslam-mono

services:
  cuvslam-mono:
    image: leash-cuvslam-mono:17.0.0-cu12
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    runtime: nvidia
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      LEASH_URL: ${LEASH_URL:-http://host.docker.internal:8000}
      LEASH_CAMERA_URL: ${LEASH_CAMERA_URL:-http://host.docker.internal:8000/camera/stream.mjpg}
      LEASH_VISUAL_ODOMETRY_TOKEN_FILE: /run/secrets/visual_odometry_token
      LEASH_CUVSLAM_CALIBRATION_FILE: /run/config/camera-calibration.json
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    secrets:
      - visual_odometry_token
    volumes:
      - type: bind
        source: ${LEASH_CUVSLAM_CALIBRATION_FILE:?set measured camera calibration file}
        target: /run/config/camera-calibration.json
        read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=8m,mode=755,uid=1000,gid=1000
    mem_limit: 2g
    cpus: 2.0

secrets:
  visual_odometry_token:
    file: ${LEASH_VISUAL_ODOMETRY_TOKEN_FILE:?set private visual odometry token file}
